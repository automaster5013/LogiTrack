name: Bug report
description: Report a reproducible problem in LogiTrack
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve LogiTrack. Do not include secrets, tokens, personal data, or vulnerability details. Report security issues privately through SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observable behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start the stack with ...
        2. Send or select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or version
      description: Commit SHA, image tag, or deployment version where the problem occurs.
      placeholder: fc821c7 or a full image tag
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Web console
        - Control API
        - Analytics
        - Simulator
        - Data or messaging
        - Observability
        - CI/CD or infrastructure
        - Documentation
        - Unknown or multiple components
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add relevant logs, screenshots, trace IDs, or configuration with sensitive values removed.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and pull requests for this problem.
          required: true
        - label: I removed credentials, tokens, personal data, and other sensitive information.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
