version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      official-actions:
        patterns:
          - "actions/*"

  - package-ecosystem: maven
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "03:10"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      api-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      time: "03:20"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      web-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories:
      - /analytics
      - /simulator
      - /scripts
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /api
      - /analytics
      - /simulator
      - /web
      - /infra/otel
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      build-images-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      runtime-images-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
