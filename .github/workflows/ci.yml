name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and domain coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Verify API and 80% domain coverage gate
        run: mvn --batch-mode --no-transfer-progress verify

  python:
    name: Python tests and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analytics/requirements.txt
      - name: Install analytics test dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/requirements.txt pytest
      - name: Test route analytics
        working-directory: analytics
        run: python -m pytest tests
      - name: Test telemetry simulator domain
        run: python -m unittest discover simulator/tests
      - name: Validate Compose topology
        run: docker compose config --quiet

  web:
    name: TypeScript production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check production console
        run: npm run build

  containers:
    name: Production container images
    needs: [api, python, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build deployable service images
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-api:ci ./api
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-analytics:ci ./analytics
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-simulator:ci ./simulator
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-web:ci ./web
      - name: Enforce non-root runtime users
        run: |
          for image in logitrack-api:ci logitrack-analytics:ci logitrack-simulator:ci logitrack-web:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            echo "$image runtime user: $user"
          done
