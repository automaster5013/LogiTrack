name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and domain coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api/pom.xml
      - name: Verify API and 80% domain coverage gate
        run: mvn --batch-mode --no-transfer-progress verify

  python:
    name: Python tests and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            analytics/requirements.txt
            simulator/requirements.txt
            scripts/requirements.txt
      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -r analytics/requirements.txt -r simulator/requirements.txt -r scripts/requirements.txt pytest
      - name: Test route analytics
        working-directory: analytics
        run: python -m pytest tests
      - name: Test telemetry simulator domain
        run: python -m unittest discover simulator/tests
      - name: Validate Compose topology
        run: python scripts/compose-config-smoke.py
      - name: Validate local secret generation
        run: python scripts/local-secrets-smoke.py
      - name: Validate isolated performance topology
        run: python scripts/perf-compose-config-smoke.py
      - name: Validate Dependabot coverage
        run: python scripts/dependabot-config-smoke.py
      - name: Validate CI trust boundaries
        run: python scripts/workflow-config-smoke.py
      - name: Validate staging publication trust boundaries
        run: python scripts/cd-workflow-smoke.py
      - name: Validate staging release manifest contract
        run: python scripts/release-manifest-validator-smoke.py
      - name: Validate AWS bootstrap trust boundaries
        run: python scripts/aws-bootstrap-smoke.py
      - name: Validate staging runtime security and cost boundaries
        run: python scripts/runtime-infra-smoke.py
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - name: Validate AWS bootstrap Terraform
        run: |
          terraform -chdir=infra/aws/bootstrap fmt -check
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap validate
      - name: Validate Cognito passkey Terraform
        run: |
          terraform -chdir=infra/aws/auth fmt -check
          terraform -chdir=infra/aws/auth init -backend=false -input=false
          terraform -chdir=infra/aws/auth validate
      - name: Validate staging runtime Terraform
        run: |
          terraform -chdir=infra/aws/runtime fmt -check
          terraform -chdir=infra/aws/runtime init -backend=false -input=false
          terraform -chdir=infra/aws/runtime validate
      - name: Validate Docker build contexts
        run: python scripts/docker-context-smoke.py
      - name: Verify PostgreSQL backup and restore round trip
        run: |
          docker compose up -d --wait postgres
          pwsh -NoLogo -NoProfile -File scripts/postgres-backup-restore-smoke.ps1
      - name: Clean up backup and restore verification
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Validate Prometheus configuration and alert rules
        run: docker run --rm --entrypoint promtool --volume "$PWD/infra:/etc/prometheus:ro" prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check config /etc/prometheus/prometheus.yml

  web:
    name: TypeScript production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and type-check production console
        run: npm run build

  containers:
    name: Production images and supply-chain security
    needs: [api, python, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject committed secrets
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            "$TRIVY_IMAGE" fs --scanners secret --offline-scan \
            --exit-code 1 --no-progress /workspace
      - name: Build deployable service images
        run: |
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-api:ci ./api
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-analytics:ci ./analytics
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-simulator:ci ./simulator
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-web:ci ./web
          docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --tag logitrack-otel-collector:ci ./infra/otel
      - name: Enforce hardened runtime metadata
        run: |
          for image in logitrack-api:ci logitrack-analytics:ci logitrack-simulator:ci logitrack-web:ci logitrack-otel-collector:ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            if [ -z "$user" ] || [ "$user" = "0" ] || [ "$user" = "root" ]; then
              echo "::error::$image runs as root"
              exit 1
            fi
            healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image")"
            if [ "$healthcheck" = "null" ] || [ "$healthcheck" = "[]" ]; then
              echo "::error::$image has no image-native healthcheck"
              exit 1
            fi
            echo "$image runtime user: $user"
            echo "$image healthcheck: $healthcheck"
          done
      - name: Generate CycloneDX SBOMs
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p work/sbom
          for service in api analytics simulator web otel-collector; do
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              --volume "$GITHUB_WORKSPACE/work/sbom:/output" \
              "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
              --output "/output/logitrack-$service.cdx.json" --no-progress \
              "logitrack-$service:ci"
            test -s "work/sbom/logitrack-$service.cdx.json"
          done
      - name: Validate SBOM identity and provenance
        run: python scripts/sbom-smoke.py work/sbom --tag ci --revision "$GITHUB_SHA"
      - name: Upload immutable image SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-sboms-${{ github.sha }}
          path: work/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Reject critical image vulnerabilities
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:ci"
            if ! docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              --volume "$GITHUB_WORKSPACE/work/sbom:/output" \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL \
              --format json --output "/output/logitrack-$service.critical.json" \
              --exit-code 1 --no-progress "$image"; then
              cat "work/sbom/logitrack-$service.critical.json"
              exit 1
            fi
            echo "$image critical vulnerabilities: 0"
          done
