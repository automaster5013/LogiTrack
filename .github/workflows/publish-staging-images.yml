name: Publish staging images

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git commit SHA from main to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-staging-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish immutable images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an immutable revision from main
        id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if ! [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a full lowercase Git commit SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_REVISION^{commit}"
          git merge-base --is-ancestor "$REQUESTED_REVISION" origin/main
          git checkout --detach "$REQUESTED_REVISION"
          echo "sha=$REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: logitrack-staging-${{ github.run_id }}
      - name: Verify the intended AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if ! [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is missing or invalid"
            exit 1
          fi
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]; then
            echo "::error::OIDC role resolved to an unexpected AWS account"
            exit 1
          fi
      - name: Validate pre-provisioned ECR repositories
        env:
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
        run: |
          if ! [[ "$ECR_REPOSITORY_PREFIX" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::ECR_REPOSITORY_PREFIX is missing or invalid"
            exit 1
          fi
          for service in api analytics simulator web otel-collector; do
            repository="$ECR_REPOSITORY_PREFIX/$service"
            configuration="$(aws ecr describe-repositories \
              --repository-names "$repository" \
              --query 'repositories[0].{tagMutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush,encryptionType:encryptionConfiguration.encryptionType}' \
              --output json)"
            if ! jq -e \
              '.tagMutability == "IMMUTABLE" and .scanOnPush == true and .encryptionType == "AES256"' \
              <<< "$configuration" >/dev/null; then
              echo "::error::$repository must use immutable tags, scan-on-push, and AES256 encryption"
              exit 1
            fi
            lifecycle_policy="$(aws ecr get-lifecycle-policy \
              --repository-name "$repository" \
              --query lifecyclePolicyText \
              --output text)"
            if ! jq -e '
              .rules as $rules |
              ($rules | length) == 2 and
              any($rules[];
                .rulePriority == 1 and
                .selection.tagStatus == "untagged" and
                .selection.countType == "sinceImagePushed" and
                .selection.countUnit == "days" and
                (.selection.countNumber >= 1 and .selection.countNumber <= 30) and
                .action.type == "expire") and
              any($rules[];
                .rulePriority == 2 and
                .selection.tagStatus == "any" and
                .selection.countType == "imageCountMoreThan" and
                (.selection.countNumber >= 10 and .selection.countNumber <= 200) and
                .action.type == "expire")
            ' <<< "$lifecycle_policy" >/dev/null; then
              echo "::error::$repository must keep the bounded two-rule staging lifecycle policy"
              exit 1
            fi
          done
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6
      - name: Build deployable service images
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          docker build --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-api:$REVISION" ./api
          docker build --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-analytics:$REVISION" ./analytics
          docker build --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-simulator:$REVISION" ./simulator
          docker build --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-web:$REVISION" ./web
          docker build --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-otel-collector:$REVISION" ./infra/otel
      - name: Enforce hardened runtime metadata
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image")"
            test -n "$user" && test "$user" != "0" && test "$user" != "root"
            test "$healthcheck" != "null" && test "$healthcheck" != "[]"
          done
      - name: Generate and validate SBOMs and vulnerability reports
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p work/sbom
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              --volume "$GITHUB_WORKSPACE/work/sbom:/output" \
              "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
              --output "/output/logitrack-$service.cdx.json" --no-progress "$image"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL \
              --exit-code 1 --no-progress "$image"
          done
          python scripts/sbom-smoke.py work/sbom --tag "$REVISION" --revision "$REVISION"
      - name: Upload immutable staging SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-container-sboms-${{ steps.revision.outputs.sha }}
          path: work/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Push or verify commit-addressed images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          for service in api analytics simulator web otel-collector; do
            source="logitrack-$service:$REVISION"
            destination="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/$service:$REVISION"
            repository="$ECR_REPOSITORY_PREFIX/$service"
            if existing_digest="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=$REVISION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null)"; then
              if ! [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::$repository:$REVISION returned an invalid existing digest"
                exit 1
              fi
              docker pull "$destination"
              published_revision="$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$destination")"
              if [ "$published_revision" != "$REVISION" ]; then
                echo "::error::$repository:$REVISION is occupied by an image with mismatched provenance"
                exit 1
              fi
              echo "$repository:$REVISION already exists with verified revision label; reusing $existing_digest"
              continue
            fi
            docker tag "$source" "$destination"
            docker push "$destination"
          done
      - name: Verify published digests and create release manifest
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p work/release
          manifest="work/release/staging-release-manifest.json"
          jq -n \
            --arg revision "$REVISION" \
            --arg accountId "$EXPECTED_AWS_ACCOUNT_ID" \
            --arg region "$AWS_REGION" \
            '{schemaVersion: 1, revision: $revision, awsAccountId: $accountId, awsRegion: $region, images: []}' \
            > "$manifest"
          for service in api analytics simulator web otel-collector; do
            repository="$ECR_REPOSITORY_PREFIX/$service"
            digest="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=$REVISION" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$repository:$REVISION has no valid published digest"
              exit 1
            fi
            jq \
              --arg service "$service" \
              --arg repository "$repository" \
              --arg digest "$digest" \
              --arg uri "$ECR_REGISTRY/$repository@$digest" \
              '.images += [{service: $service, repository: $repository, digest: $digest, uri: $uri}]' \
              "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
          python scripts/release-manifest-smoke.py "$manifest" \
            --revision "$REVISION" \
            --account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --region "$AWS_REGION" \
            --registry "$ECR_REGISTRY" \
            --repository-prefix "$ECR_REPOSITORY_PREFIX"
      - name: Upload immutable staging release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-release-manifest-${{ steps.revision.outputs.sha }}
          path: work/release/staging-release-manifest.json
          if-no-files-found: error
          retention-days: 30
