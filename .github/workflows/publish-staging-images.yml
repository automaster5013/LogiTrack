name: Publish staging images
run-name: Publish staging ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git commit SHA from main to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-staging-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish immutable images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: staging
    env:
      ARTIFACT_RETENTION_DAYS: 30
      DEPLOYMENT_ENVIRONMENT: staging
      IMAGE_PLATFORM: linux/amd64
      MAX_IMAGE_SIZE_BYTES: 2147483648
      MAX_TOTAL_IMAGE_SIZE_BYTES: 5368709120
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: 5
      AWS_PAGER: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an immutable revision from main
        id: revision
        env:
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: |
          if ! [[ "$REQUESTED_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::revision must be a full lowercase Git commit SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "$REQUESTED_REVISION^{commit}"
          git merge-base --is-ancestor "$REQUESTED_REVISION" origin/main
          git checkout --detach "$REQUESTED_REVISION"
          echo "sha=$REQUESTED_REVISION" >> "$GITHUB_OUTPUT"
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: logitrack-staging-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          retry-max-attempts: 5
          action-timeout-s: 120
          unset-current-credentials: true
          translate-env-variables: false
      - name: Verify the intended AWS account
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          if ! [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_ACCOUNT_ID is missing or invalid"
            exit 1
          fi
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]; then
            echo "::error::OIDC role resolved to an unexpected AWS account"
            exit 1
          fi
      - name: Validate pre-provisioned ECR repositories
        env:
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
        run: |
          if ! [[ "$ECR_REPOSITORY_PREFIX" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::ECR_REPOSITORY_PREFIX is missing or invalid"
            exit 1
          fi
          for service in api analytics simulator web otel-collector; do
            repository="$ECR_REPOSITORY_PREFIX/$service"
            configuration="$(aws ecr describe-repositories \
              --repository-names "$repository" \
              --query 'repositories[0].{tagMutability:imageTagMutability,scanOnPush:imageScanningConfiguration.scanOnPush,encryptionType:encryptionConfiguration.encryptionType}' \
              --output json)"
            if ! jq -e \
              '.tagMutability == "IMMUTABLE" and .scanOnPush == true and .encryptionType == "AES256"' \
              <<< "$configuration" >/dev/null; then
              echo "::error::$repository must use immutable tags, scan-on-push, and AES256 encryption"
              exit 1
            fi
            lifecycle_policy="$(aws ecr get-lifecycle-policy \
              --repository-name "$repository" \
              --query lifecyclePolicyText \
              --output text)"
            if ! jq -e '
              .rules as $rules |
              ($rules | length) == 2 and
              any($rules[];
                .rulePriority == 1 and
                .selection.tagStatus == "untagged" and
                .selection.countType == "sinceImagePushed" and
                .selection.countUnit == "days" and
                (.selection.countNumber >= 1 and .selection.countNumber <= 30) and
                .action.type == "expire") and
              any($rules[];
                .rulePriority == 2 and
                .selection.tagStatus == "any" and
                .selection.countType == "imageCountMoreThan" and
                (.selection.countNumber >= 10 and .selection.countNumber <= 200) and
                .action.type == "expire")
            ' <<< "$lifecycle_policy" >/dev/null; then
              echo "::error::$repository must keep the bounded two-rule staging lifecycle policy"
              exit 1
            fi
          done
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6
      - name: Verify the ECR registry endpoint
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          expected_registry="$EXPECTED_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          if [ "$ECR_REGISTRY" != "$expected_registry" ]; then
            echo "::error::ECR login resolved to an unexpected registry"
            exit 1
          fi
      - name: Build deployable service images
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          docker build --label org.opencontainers.image.revision="$REVISION" --label org.opencontainers.image.source="$SOURCE_URL" --tag "logitrack-api:$REVISION" ./api
          docker build --label org.opencontainers.image.revision="$REVISION" --label org.opencontainers.image.source="$SOURCE_URL" --tag "logitrack-analytics:$REVISION" ./analytics
          docker build --label org.opencontainers.image.revision="$REVISION" --label org.opencontainers.image.source="$SOURCE_URL" --tag "logitrack-simulator:$REVISION" ./simulator
          docker build --label org.opencontainers.image.revision="$REVISION" --label org.opencontainers.image.source="$SOURCE_URL" --tag "logitrack-web:$REVISION" ./web
          docker build --label org.opencontainers.image.revision="$REVISION" --label org.opencontainers.image.source="$SOURCE_URL" --tag "logitrack-otel-collector:$REVISION" ./infra/otel
      - name: Enforce hardened runtime metadata
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image")"
            revision_label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")"
            source_label="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' "$image")"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")"
            test -n "$user" && test "$user" != "0" && test "$user" != "root"
            test "$healthcheck" != "null" && test "$healthcheck" != "[]"
            test "$revision_label" = "$REVISION" && test "$source_label" = "$SOURCE_URL"
            if [ "$platform" != "$IMAGE_PLATFORM" ]; then
              echo "::error::$image targets unsupported platform $platform"
              exit 1
            fi
          done
      - name: Generate and validate SBOMs and vulnerability reports
        env:
          REVISION: ${{ steps.revision.outputs.sha }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          mkdir -p work/sbom
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              --volume "$GITHUB_WORKSPACE/work/sbom:/output" \
              "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx \
              --output "/output/logitrack-$service.cdx.json" --no-progress "$image"
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume trivy-cache:/root/.cache/ \
              "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL \
              --exit-code 1 --no-progress "$image"
          done
          python scripts/sbom-smoke.py work/sbom --tag "$REVISION" --revision "$REVISION"
      - name: Upload immutable staging SBOMs
        id: sboms
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-container-sboms-${{ steps.revision.outputs.sha }}
          path: work/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - name: Push or verify commit-addressed images
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          REVISION: ${{ steps.revision.outputs.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          for service in api analytics simulator web otel-collector; do
            source="logitrack-$service:$REVISION"
            destination="$ECR_REGISTRY/$ECR_REPOSITORY_PREFIX/$service:$REVISION"
            repository="$ECR_REPOSITORY_PREFIX/$service"
            if existing_digest="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=$REVISION" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null)"; then
              if ! [[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::$repository:$REVISION returned an invalid existing digest"
                exit 1
              fi
              pinned_destination="$ECR_REGISTRY/$repository@$existing_digest"
              docker pull "$pinned_destination"
              published_revision="$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$pinned_destination")"
              published_source="$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
                "$pinned_destination")"
              published_platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$pinned_destination")"
              if [ "$published_revision" != "$REVISION" ] || [ "$published_source" != "$SOURCE_URL" ] || [ "$published_platform" != "$IMAGE_PLATFORM" ]; then
                echo "::error::$repository:$REVISION is occupied by an image with mismatched provenance or platform"
                exit 1
              fi
              echo "$repository:$REVISION already exists with verified revision label; reusing $existing_digest"
              continue
            fi
            docker tag "$source" "$destination"
            docker push "$destination"
          done
      - name: Verify published digests and create release manifest
        id: release
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          REVISION: ${{ steps.revision.outputs.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          WORKFLOW_ACTOR: ${{ github.actor }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SBOM_ARTIFACT_DIGEST: ${{ steps.sboms.outputs.artifact-digest }}
          SBOM_ARTIFACT_URL: ${{ steps.sboms.outputs.artifact-url }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          mkdir -p work/release
          manifest="work/release/staging-release-manifest.json"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "published-at=$published_at" >> "$GITHUB_OUTPUT"
          expected_workflow_ref="$SOURCE_REPOSITORY/.github/workflows/publish-staging-images.yml@refs/heads/main"
          if [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::staging publication must run from the main workflow definition"
            exit 1
          fi
          jq -n \
            --arg revision "$REVISION" \
            --arg accountId "$EXPECTED_AWS_ACCOUNT_ID" \
            --arg deploymentEnvironment "$DEPLOYMENT_ENVIRONMENT" \
            --arg imagePlatform "$IMAGE_PLATFORM" \
            --arg region "$AWS_REGION" \
            --arg sourceRepository "$SOURCE_REPOSITORY" \
            --arg sbomArtifact "staging-container-sboms-$REVISION" \
            --arg sbomArtifactDigest "$SBOM_ARTIFACT_DIGEST" \
            --arg sbomArtifactUrl "$SBOM_ARTIFACT_URL" \
            --arg workflowRunUrl "$WORKFLOW_RUN_URL" \
            --arg workflowActor "$WORKFLOW_ACTOR" \
            --arg workflowEvent "$WORKFLOW_EVENT" \
            --arg workflowRef "$WORKFLOW_REF" \
            --arg workflowSha "$WORKFLOW_SHA" \
            --arg workflowTriggeringActor "$WORKFLOW_TRIGGERING_ACTOR" \
            --arg publishedAt "$published_at" \
            --argjson artifactRetentionDays "$ARTIFACT_RETENTION_DAYS" \
            --argjson maxImageSizeBytes "$MAX_IMAGE_SIZE_BYTES" \
            --argjson maxTotalImageSizeBytes "$MAX_TOTAL_IMAGE_SIZE_BYTES" \
            --argjson workflowRunId "$WORKFLOW_RUN_ID" \
            --argjson workflowRunAttempt "$WORKFLOW_RUN_ATTEMPT" \
            '{schemaVersion: 16, revision: $revision, publishedAt: $publishedAt, deploymentEnvironment: $deploymentEnvironment, imagePlatform: $imagePlatform, maxImageSizeBytes: $maxImageSizeBytes, maxTotalImageSizeBytes: $maxTotalImageSizeBytes, totalImageSizeBytes: 0, awsAccountId: $accountId, awsRegion: $region, sourceRepository: $sourceRepository, workflowRunId: $workflowRunId, workflowRunAttempt: $workflowRunAttempt, workflowRunUrl: $workflowRunUrl, workflowActor: $workflowActor, workflowTriggeringActor: $workflowTriggeringActor, workflowEvent: $workflowEvent, workflowRef: $workflowRef, workflowSha: $workflowSha, artifactRetentionDays: $artifactRetentionDays, sbomArtifact: $sbomArtifact, sbomArtifactDigest: $sbomArtifactDigest, sbomArtifactUrl: $sbomArtifactUrl, images: []}' \
            > "$manifest"
          for service in api analytics simulator web otel-collector; do
            repository="$ECR_REPOSITORY_PREFIX/$service"
            sbom_file="logitrack-$service.cdx.json"
            sbom_sha256="$(sha256sum "work/sbom/$sbom_file" | awk '{print $1}')"
            if ! [[ "$sbom_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::$service SBOM has no valid SHA-256"
              exit 1
            fi
            digest="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageTag=$REVISION" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::$repository:$REVISION has no valid published digest"
              exit 1
            fi
            media_type="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageDigest=$digest" \
              --query 'imageDetails[0].imageManifestMediaType' \
              --output text)"
            case "$media_type" in
              application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
              *)
                echo "::error::$repository@$digest has unsupported manifest media type $media_type"
                exit 1
                ;;
            esac
            size_bytes="$(aws ecr describe-images \
              --repository-name "$repository" \
              --image-ids "imageDigest=$digest" \
              --query 'imageDetails[0].imageSizeInBytes' \
              --output text)"
            if ! [[ "$size_bytes" =~ ^[1-9][0-9]*$ ]] || [ "$size_bytes" -gt "$MAX_IMAGE_SIZE_BYTES" ]; then
              echo "::error::$repository@$digest size must be between 1 and $MAX_IMAGE_SIZE_BYTES bytes"
              exit 1
            fi
            jq \
              --arg service "$service" \
              --arg repository "$repository" \
              --arg digest "$digest" \
              --arg mediaType "$media_type" \
              --arg uri "$ECR_REGISTRY/$repository@$digest" \
              --arg sbomFile "$sbom_file" \
              --arg sbomSha256 "$sbom_sha256" \
              --argjson sizeBytes "$size_bytes" \
              '.images += [{service: $service, repository: $repository, digest: $digest, mediaType: $mediaType, sizeBytes: $sizeBytes, uri: $uri, sbomFile: $sbomFile, sbomSha256: $sbomSha256}] | .totalImageSizeBytes = ([.images[].sizeBytes] | add)' \
              "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done
          total_image_size_bytes="$(jq -r '.totalImageSizeBytes' "$manifest")"
          if ! [[ "$total_image_size_bytes" =~ ^[1-9][0-9]*$ ]] || [ "$total_image_size_bytes" -gt "$MAX_TOTAL_IMAGE_SIZE_BYTES" ]; then
            echo "::error::release image total must be between 1 and $MAX_TOTAL_IMAGE_SIZE_BYTES bytes"
            exit 1
          fi
          echo "total-image-size-bytes=$total_image_size_bytes" >> "$GITHUB_OUTPUT"
          python scripts/release-manifest-smoke.py "$manifest" \
            --revision "$REVISION" \
            --account-id "$EXPECTED_AWS_ACCOUNT_ID" \
            --artifact-retention-days "$ARTIFACT_RETENTION_DAYS" \
            --deployment-environment "$DEPLOYMENT_ENVIRONMENT" \
            --image-platform "$IMAGE_PLATFORM" \
            --max-image-size-bytes "$MAX_IMAGE_SIZE_BYTES" \
            --max-total-image-size-bytes "$MAX_TOTAL_IMAGE_SIZE_BYTES" \
            --region "$AWS_REGION" \
            --repository "$SOURCE_REPOSITORY" \
            --published-at "$published_at" \
            --run-id "$WORKFLOW_RUN_ID" \
            --run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --run-url "$WORKFLOW_RUN_URL" \
            --workflow-actor "$WORKFLOW_ACTOR" \
            --workflow-event "$WORKFLOW_EVENT" \
            --workflow-ref "$WORKFLOW_REF" \
            --workflow-sha "$WORKFLOW_SHA" \
            --workflow-triggering-actor "$WORKFLOW_TRIGGERING_ACTOR" \
            --registry "$ECR_REGISTRY" \
            --repository-prefix "$ECR_REPOSITORY_PREFIX" \
            --sbom-artifact-digest "$SBOM_ARTIFACT_DIGEST" \
            --sbom-artifact-url "$SBOM_ARTIFACT_URL" \
            --sbom-dir work/sbom
      - name: Upload immutable staging release manifest
        id: release-manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-release-manifest-${{ steps.revision.outputs.sha }}
          path: work/release/staging-release-manifest.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
      - name: Record immutable publication summary
        env:
          RELEASE_MANIFEST_DIGEST: ${{ steps.release-manifest.outputs.artifact-digest }}
          RELEASE_MANIFEST_URL: ${{ steps.release-manifest.outputs.artifact-url }}
          PUBLISHED_AT: ${{ steps.release.outputs.published-at }}
          TOTAL_IMAGE_SIZE_BYTES: ${{ steps.release.outputs.total-image-size-bytes }}
          REVISION: ${{ steps.revision.outputs.sha }}
          SBOM_ARTIFACT_DIGEST: ${{ steps.sboms.outputs.artifact-digest }}
          SBOM_ARTIFACT_URL: ${{ steps.sboms.outputs.artifact-url }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_ACTOR: ${{ github.actor }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          for digest in "$SBOM_ARTIFACT_DIGEST" "$RELEASE_MANIFEST_DIGEST"; do
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::GitHub returned an invalid artifact digest"
              exit 1
            fi
          done
          artifact_url_pattern="^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/[0-9]+$"
          for artifact_url in "$SBOM_ARTIFACT_URL" "$RELEASE_MANIFEST_URL"; do
            if ! [[ "$artifact_url" =~ $artifact_url_pattern ]]; then
              echo "::error::GitHub returned an unexpected artifact URL"
              exit 1
            fi
          done
          if [ "$WORKFLOW_RUN_URL" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" ]; then
            echo "::error::workflow run URL does not match the current run"
            exit 1
          fi
          if ! [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::workflow run attempt must be positive"
            exit 1
          fi
          if [ "$WORKFLOW_EVENT" != "workflow_dispatch" ]; then
            echo "::error::staging publication must use the workflow_dispatch event"
            exit 1
          fi
          if [ "$DEPLOYMENT_ENVIRONMENT" != "staging" ]; then
            echo "::error::deployment environment must be staging"
            exit 1
          fi
          if ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::workflow definition SHA must be a full lowercase Git SHA"
            exit 1
          fi
          github_login_pattern='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          for actor in "$WORKFLOW_ACTOR" "$WORKFLOW_TRIGGERING_ACTOR"; do
            if ! [[ "$actor" =~ $github_login_pattern ]]; then
              echo "::error::workflow actor must be a valid GitHub login"
              exit 1
            fi
          done
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/publish-staging-images.yml@refs/heads/main"
          if [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::workflow definition ref does not match main"
            exit 1
          fi
          if ! [[ "$ARTIFACT_RETENTION_DAYS" =~ ^[1-9][0-9]*$ ]] || [ "$ARTIFACT_RETENTION_DAYS" -gt 90 ]; then
            echo "::error::artifact retention must be between 1 and 90 days"
            exit 1
          fi
          {
            echo "## Immutable staging publication"
            echo
            echo "- Revision: \`$REVISION\`"
            echo "- Published at: \`$PUBLISHED_AT\`"
            echo "- Deployment environment: \`$DEPLOYMENT_ENVIRONMENT\`"
            echo "- Image platform: \`$IMAGE_PLATFORM\`"
            echo "- Maximum image size: \`$MAX_IMAGE_SIZE_BYTES bytes\`"
            echo "- Maximum total image size: \`$MAX_TOTAL_IMAGE_SIZE_BYTES bytes\`"
            echo "- Published image total: \`$TOTAL_IMAGE_SIZE_BYTES bytes\`"
            echo "- Publication run: [$GITHUB_RUN_ID]($WORKFLOW_RUN_URL), attempt \`$WORKFLOW_RUN_ATTEMPT\`"
            echo "- Workflow definition SHA: \`$WORKFLOW_SHA\`"
            echo "- Workflow definition ref: \`$WORKFLOW_REF\`"
            echo "- Workflow actor: \`$WORKFLOW_ACTOR\`"
            echo "- Triggering actor: \`$WORKFLOW_TRIGGERING_ACTOR\`"
            echo "- Workflow event: \`$WORKFLOW_EVENT\`"
            echo "- Artifact retention: \`$ARTIFACT_RETENTION_DAYS days\`"
            echo "- SBOM artifact: [\`staging-container-sboms-$REVISION\`]($SBOM_ARTIFACT_URL)"
            echo "- SBOM artifact digest: \`$SBOM_ARTIFACT_DIGEST\`"
            echo "- Release manifest artifact: [\`staging-release-manifest-$REVISION\`]($RELEASE_MANIFEST_URL)"
            echo "- Release manifest artifact digest: \`$RELEASE_MANIFEST_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
