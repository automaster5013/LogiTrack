name: Staging external health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: staging-external-health
  cancel-in-progress: true

jobs:
  health:
    name: Verify public staging boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      AUTH_HOST: auth.logitrack.kr
      TARGET_HOST: www.logitrack.kr
    steps:
      - name: Verify DNS, application identity, TLS, headers, and private ports
        shell: bash
        run: |
          set -euo pipefail
          getent ahostsv4 "$TARGET_HOST" >/dev/null
          getent ahostsv4 "$AUTH_HOST" >/dev/null

          http_headers="$(curl --silent --show-error --head --max-time 15 "http://$TARGET_HOST/login" | tr -d '\r')"
          grep -Eq '^HTTP/[0-9.]+ (301|302|307|308)' <<<"$http_headers"
          grep -Eqi '^location: https://www\.logitrack\.kr/login$' <<<"$http_headers"

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --output /tmp/logitrack-home "https://$TARGET_HOST/"
          grep -Fq 'LIVE LOGISTICS INTELLIGENCE' /tmp/logitrack-home
          grep -Fq '물류의 모든 순간을' /tmp/logitrack-home

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-showcase-headers --output /tmp/logitrack-showcase \
            "https://$TARGET_HOST/showcase"
          for content in 'LIVE LOGISTICS INTELLIGENCE' 'SEOUL CONTROL TOWER' \
            '주문과 운송의 연결' '재고와 현장의 동기화' '문제를 놓치지 않는 운영'; do
            grep -Fq "$content" /tmp/logitrack-showcase
          done
          tr -d '\r' </tmp/logitrack-showcase-headers >/tmp/logitrack-showcase-headers.normalized
          grep -Eqi '^strict-transport-security: max-age=31536000; includeSubDomains$' /tmp/logitrack-showcase-headers.normalized
          grep -Eqi "^content-security-policy: .*default-src 'self'.*connect-src 'self' https://tiles.openfreemap.org.*frame-ancestors 'none'.*frame-src 'none'.*img-src 'self' data: blob: https://tiles.openfreemap.org.*media-src 'none'.*script-src 'self' 'nonce-[A-Za-z0-9+/=]+' 'strict-dynamic'.*worker-src 'self' blob:" /tmp/logitrack-showcase-headers.normalized
          ! grep -Eqi "^content-security-policy: .*script-src[^;]*'unsafe-inline'" /tmp/logitrack-showcase-headers.normalized
          grep -Eqi "^content-security-policy: .*style-src 'self';.*style-src-elem 'self' 'nonce-[A-Za-z0-9+/=]+';.*style-src-attr 'unsafe-inline'" /tmp/logitrack-showcase-headers.normalized
          ! grep -Eqi "^content-security-policy: .*style-src 'self' 'unsafe-inline'|^content-security-policy: .*style-src-elem[^;]*'unsafe-inline'" /tmp/logitrack-showcase-headers.normalized
          showcase_nonce="$(sed -nE "s/^content-security-policy: .*script-src 'self' 'nonce-([^']+)'.*/\1/Ip" /tmp/logitrack-showcase-headers.normalized)"
          test -n "$showcase_nonce"
          ! grep -oE '<script[^>]*>' /tmp/logitrack-showcase | grep -Fv "nonce=\"$showcase_nonce\""
          ! grep -oE '<style[^>]*>' /tmp/logitrack-showcase | grep -Fv "nonce=\"$showcase_nonce\""
          ! grep -Eqi '^content-security-policy: .*localhost|^content-security-policy: .*127\.0\.0\.1' /tmp/logitrack-showcase-headers.normalized
          grep -oE 'href="/_next/static/(css|chunks)/[^"]+\.css"' /tmp/logitrack-showcase \
            | cut -d'"' -f2 | sort -u >/tmp/logitrack-showcase-css-paths
          test -s /tmp/logitrack-showcase-css-paths
          : >/tmp/logitrack-showcase.css
          while read -r showcase_css; do
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
              "https://$TARGET_HOST$showcase_css" >>/tmp/logitrack-showcase.css
          done </tmp/logitrack-showcase-css-paths
          grep -Fq 'height:100dvh' /tmp/logitrack-showcase.css
          grep -Fq 'grid-template-rows:64px minmax(0,1fr) auto 38px' /tmp/logitrack-showcase.css

          console_headers="$(curl --silent --show-error --head --proto '=https' --tlsv1.2 --max-time 20 \
            "https://$TARGET_HOST/console" | tr -d '\r')"
          grep -Eq '^HTTP/[0-9.]+ (302|303|307|308)' <<<"$console_headers"
          grep -Eqi '^location: https://www\.logitrack\.kr/login\?returnTo=%2Fconsole$' <<<"$console_headers"
          grep -Eqi '^cache-control: .*no-store' <<<"$console_headers"

          forged_header="$(printf '%s' '{"alg":"none"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          forged_payload="$(printf '%s' '{"exp":4102444800}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          forged_token="$forged_header.$forged_payload."
          forged_console_headers="$(curl --silent --show-error --head --proto '=https' --tlsv1.2 --max-time 20 \
            --cookie "__Host-lt_access_token=$forged_token" \
            "https://$TARGET_HOST/console" | tr -d '\r')"
          grep -Eq '^HTTP/[0-9.]+ (302|303|307|308)' <<<"$forged_console_headers"
          grep -Eqi '^location: https://www\.logitrack\.kr/login\?returnTo=%2Fconsole$' <<<"$forged_console_headers"
          grep -Eqi '^cache-control: .*no-store' <<<"$forged_console_headers"
          grep -Eqi '^set-cookie: __Host-lt_access_token=;.*max-age=0' <<<"$forged_console_headers"

          curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-auth-login-headers --output /dev/null \
            "https://$TARGET_HOST/auth/login"
          tr -d '\r' </tmp/logitrack-auth-login-headers >/tmp/logitrack-auth-login-headers.normalized
          grep -Eq '^HTTP/[0-9.]+ (302|303|307|308)' /tmp/logitrack-auth-login-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-auth-login-headers.normalized
          for cookie in __Host-lt_oauth_state __Host-lt_oidc_nonce __Host-lt_pkce_verifier; do
            grep -Eqi "^set-cookie: $cookie=[A-Za-z0-9_-]+; Path=/; .*Max-Age=300; Secure; HttpOnly; SameSite=lax$" \
              /tmp/logitrack-auth-login-headers.normalized
          done
          authorization_location="$(sed -n 's/^location: //Ip' /tmp/logitrack-auth-login-headers.normalized)"
          grep -Eq '^https://auth\.logitrack\.kr/oauth2/authorize\?' <<<"$authorization_location"
          [[ "$authorization_location" == *'response_type=code'* ]]
          [[ "$authorization_location" == *'client_id='* ]]
          [[ "$authorization_location" == *'redirect_uri=https%3A%2F%2Fwww.logitrack.kr%2Fauth%2Fcallback'* ]]
          [[ "$authorization_location" == *'scope=openid+profile'* ]]
          [[ "$authorization_location" == *'prompt=login'* ]]
          [[ "$authorization_location" == *'code_challenge_method=S256'* ]]
          redirect_state="$(sed -nE 's/.*[?&]state=([^&]+).*/\1/p' <<<"$authorization_location")"
          redirect_nonce="$(sed -nE 's/.*[?&]nonce=([^&]+).*/\1/p' <<<"$authorization_location")"
          redirect_challenge="$(sed -nE 's/.*[?&]code_challenge=([^&]+).*/\1/p' <<<"$authorization_location")"
          cookie_state="$(sed -nE 's/^set-cookie: __Host-lt_oauth_state=([^;]+).*/\1/Ip' /tmp/logitrack-auth-login-headers.normalized)"
          cookie_nonce="$(sed -nE 's/^set-cookie: __Host-lt_oidc_nonce=([^;]+).*/\1/Ip' /tmp/logitrack-auth-login-headers.normalized)"
          pkce_verifier="$(sed -nE 's/^set-cookie: __Host-lt_pkce_verifier=([^;]+).*/\1/Ip' /tmp/logitrack-auth-login-headers.normalized)"
          expected_challenge="$(printf %s "$pkce_verifier" | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')"
          test -n "$redirect_state" && test "$redirect_state" = "$cookie_state"
          test -n "$redirect_nonce" && test "$redirect_nonce" = "$cookie_nonce"
          test -n "$redirect_challenge" && test "$redirect_challenge" = "$expected_challenge"

          invalid_callback_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-invalid-callback-headers --output /dev/null \
            --write-out '%{http_code}' "https://$TARGET_HOST/auth/callback")"
          test "$invalid_callback_status" = 307
          tr -d '\r' </tmp/logitrack-invalid-callback-headers >/tmp/logitrack-invalid-callback-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-invalid-callback-headers.normalized
          grep -Eqi '^location: https://www\.logitrack\.kr/login\?error=invalid_oauth_response$' \
            /tmp/logitrack-invalid-callback-headers.normalized
          for cookie in __Host-lt_oauth_state __Host-lt_oidc_nonce __Host-lt_pkce_verifier; do
            grep -Eqi "^set-cookie: $cookie=; Path=/; .*Max-Age=0; Secure; HttpOnly; SameSite=lax$" \
              /tmp/logitrack-invalid-callback-headers.normalized
          done
          if grep -Eqi '^set-cookie: (__Host-)?lt_access_token=[^;]+' /tmp/logitrack-invalid-callback-headers.normalized; then
            echo 'invalid callback must not create or mutate the access token cookie' >&2
            exit 1
          fi

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-headers --output /tmp/logitrack-login \
            "https://$TARGET_HOST/login"
          test -s /tmp/logitrack-login
          grep -Fq 'SECURE OPERATOR ACCESS' /tmp/logitrack-login
          grep -Fq '운영자 로그인' /tmp/logitrack-login

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-known-auth-error-headers \
            --output /tmp/logitrack-known-auth-error \
            "https://$TARGET_HOST/login?error=token_exchange_failed"
          grep -Fq '인증 서버가 로그인을 완료하지 못했습니다' /tmp/logitrack-known-auth-error
          grep -Fq '다시 로그인하기' /tmp/logitrack-known-auth-error
          grep -Fq 'role="alert"' /tmp/logitrack-known-auth-error
          tr -d '\r' </tmp/logitrack-known-auth-error-headers >/tmp/logitrack-known-auth-error-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-known-auth-error-headers.normalized
          if grep -Eqi '^set-cookie:' /tmp/logitrack-known-auth-error-headers.normalized; then
            echo 'authentication error pages must not mutate authentication cookies' >&2
            exit 1
          fi

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --output /tmp/logitrack-unknown-auth-error \
            "https://$TARGET_HOST/login?error=unknown"
          if grep -Fq 'role="alert"' /tmp/logitrack-unknown-auth-error; then
            echo 'unknown authentication errors must not be rendered as trusted operator guidance' >&2
            exit 1
          fi

          tr -d '\r' </tmp/logitrack-headers >/tmp/logitrack-headers.normalized
          grep -Eqi '^strict-transport-security: max-age=31536000; includeSubDomains$' /tmp/logitrack-headers.normalized
          grep -Eqi "^content-security-policy: .*default-src 'self'.*connect-src 'self' https://tiles.openfreemap.org.*frame-ancestors 'none'.*frame-src 'none'.*img-src 'self' data: blob: https://tiles.openfreemap.org.*media-src 'none'.*script-src 'self' 'nonce-[A-Za-z0-9+/=]+' 'strict-dynamic'.*worker-src 'self' blob:" /tmp/logitrack-headers.normalized
          ! grep -Eqi "^content-security-policy: .*script-src[^;]*'unsafe-inline'" /tmp/logitrack-headers.normalized
          grep -Eqi "^content-security-policy: .*style-src 'self';.*style-src-elem 'self' 'nonce-[A-Za-z0-9+/=]+';.*style-src-attr 'unsafe-inline'" /tmp/logitrack-headers.normalized
          ! grep -Eqi "^content-security-policy: .*style-src 'self' 'unsafe-inline'|^content-security-policy: .*style-src-elem[^;]*'unsafe-inline'" /tmp/logitrack-headers.normalized
          login_nonce="$(sed -nE "s/^content-security-policy: .*script-src 'self' 'nonce-([^']+)'.*/\1/Ip" /tmp/logitrack-headers.normalized)"
          test -n "$login_nonce"
          ! grep -oE '<script[^>]*>' /tmp/logitrack-login | grep -Fv "nonce=\"$login_nonce\""
          ! grep -oE '<style[^>]*>' /tmp/logitrack-login | grep -Fv "nonce=\"$login_nonce\""
          ! grep -Eqi '^content-security-policy: .*localhost|^content-security-policy: .*127\.0\.0\.1' /tmp/logitrack-headers.normalized
          grep -Eqi '^x-content-type-options: nosniff$' /tmp/logitrack-headers.normalized
          grep -Eqi '^x-frame-options: DENY$' /tmp/logitrack-headers.normalized
          grep -Eqi '^cross-origin-opener-policy: same-origin$' /tmp/logitrack-headers.normalized
          grep -Eqi '^cross-origin-resource-policy: same-origin$' /tmp/logitrack-headers.normalized
          grep -Eqi '^origin-agent-cluster: \?1$' /tmp/logitrack-headers.normalized
          grep -Eqi '^x-permitted-cross-domain-policies: none$' /tmp/logitrack-headers.normalized
          if grep -Eqi '^(server|via|x-powered-by|x-nextjs-[^:]*):' /tmp/logitrack-headers.normalized; then
            echo 'server, proxy, and application framework identity headers must remain suppressed' >&2
            exit 1
          fi

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-runtime-headers --output /tmp/logitrack-runtime \
            "https://$TARGET_HOST/api/runtime-version"
          jq -e '.version | type == "string" and test("^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")' \
            /tmp/logitrack-runtime >/dev/null
          tr -d '\r' </tmp/logitrack-runtime-headers >/tmp/logitrack-runtime-headers.normalized
          grep -Eqi '^content-type: application/json' /tmp/logitrack-runtime-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-runtime-headers.normalized

          originless_logout_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --request POST --dump-header /tmp/logitrack-originless-logout-headers \
            --output /tmp/logitrack-originless-logout --write-out '%{http_code}' \
            "https://$TARGET_HOST/auth/logout")"
          test "$originless_logout_status" = 403
          jq -e '.error == "cross_origin_logout_rejected"' /tmp/logitrack-originless-logout >/dev/null
          ! grep -Eqi '^set-cookie:' /tmp/logitrack-originless-logout-headers

          originless_bff_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --request POST --dump-header /tmp/logitrack-originless-bff-headers \
            --output /tmp/logitrack-originless-bff --write-out '%{http_code}' \
            "https://$TARGET_HOST/backend/api/deliveries")"
          test "$originless_bff_status" = 403
          jq -e '.error == "cross_origin_request_rejected"' /tmp/logitrack-originless-bff >/dev/null
          ! grep -Eqi '^set-cookie:' /tmp/logitrack-originless-bff-headers

          cross_origin_logout_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --request POST --header 'Origin: https://attacker.invalid' \
            --dump-header /tmp/logitrack-cross-origin-logout-headers --output /tmp/logitrack-cross-origin-logout \
            --write-out '%{http_code}' "https://$TARGET_HOST/auth/logout")"
          test "$cross_origin_logout_status" = 403
          jq -e '.error == "cross_origin_logout_rejected"' /tmp/logitrack-cross-origin-logout >/dev/null
          tr -d '\r' </tmp/logitrack-cross-origin-logout-headers >/tmp/logitrack-cross-origin-logout-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-cross-origin-logout-headers.normalized
          if grep -Eqi '^set-cookie:' /tmp/logitrack-cross-origin-logout-headers.normalized; then
            echo 'rejected cross-origin logout must not mutate authentication cookies' >&2
            exit 1
          fi

          same_origin_logout_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --request POST --header "Origin: https://$TARGET_HOST" \
            --dump-header /tmp/logitrack-same-origin-logout-headers --output /dev/null \
            --write-out '%{http_code}' "https://$TARGET_HOST/auth/logout")"
          test "$same_origin_logout_status" = 303
          tr -d '\r' </tmp/logitrack-same-origin-logout-headers >/tmp/logitrack-same-origin-logout-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-same-origin-logout-headers.normalized
          grep -Eqi '^clear-site-data: "cache", "storage"$' /tmp/logitrack-same-origin-logout-headers.normalized
          grep -Eqi '^location: https://auth\.logitrack\.kr/logout\?' /tmp/logitrack-same-origin-logout-headers.normalized
          logout_location="$(sed -n 's/^location: //Ip' /tmp/logitrack-same-origin-logout-headers.normalized)"
          [[ "$logout_location" == *'client_id='* ]]
          [[ "$logout_location" == *'logout_uri=https%3A%2F%2Fwww.logitrack.kr%2Flogin'* ]]
          for cookie in __Host-lt_access_token lt_access_token __Host-lt_oauth_state __Host-lt_oidc_nonce __Host-lt_pkce_verifier; do
            grep -Eqi "^set-cookie: $cookie=;.*max-age=0" /tmp/logitrack-same-origin-logout-headers.normalized
          done

          for method in POST DELETE; do
            cross_origin_bff_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
              --request "$method" --header 'Origin: https://attacker.invalid' \
              --dump-header /tmp/logitrack-cross-origin-bff-headers --output /tmp/logitrack-cross-origin-bff \
              --write-out '%{http_code}' \
              "https://$TARGET_HOST/backend/api/deliveries")"
            test "$cross_origin_bff_status" = 403
            jq -e '.error == "cross_origin_request_rejected"' /tmp/logitrack-cross-origin-bff >/dev/null
            tr -d '\r' </tmp/logitrack-cross-origin-bff-headers >/tmp/logitrack-cross-origin-bff-headers.normalized
            grep -Eqi '^content-type: application/json' /tmp/logitrack-cross-origin-bff-headers.normalized
            grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-cross-origin-bff-headers.normalized
            if grep -Eqi '^set-cookie:' /tmp/logitrack-cross-origin-bff-headers.normalized; then
              echo 'rejected cross-origin proxy requests must not mutate authentication cookies' >&2
              exit 1
            fi
          done

          same_origin_bff_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --request POST --header "Origin: https://$TARGET_HOST" \
            --dump-header /tmp/logitrack-same-origin-bff-headers --output /tmp/logitrack-same-origin-bff \
            --write-out '%{http_code}' \
            "https://$TARGET_HOST/backend/api/deliveries")"
          test "$same_origin_bff_status" = 401
          jq -e '.error == "authentication_required"' /tmp/logitrack-same-origin-bff >/dev/null
          tr -d '\r' </tmp/logitrack-same-origin-bff-headers >/tmp/logitrack-same-origin-bff-headers.normalized
          grep -Eqi '^content-type: application/json' /tmp/logitrack-same-origin-bff-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-same-origin-bff-headers.normalized
          if grep -Eqi '^set-cookie:' /tmp/logitrack-same-origin-bff-headers.normalized; then
            echo 'anonymous proxy rejection must not mutate authentication cookies' >&2
            exit 1
          fi

          anonymous_read_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --dump-header /tmp/logitrack-anonymous-read-headers --output /tmp/logitrack-anonymous-read \
            --write-out '%{http_code}' "https://$TARGET_HOST/backend/api/deliveries")"
          test "$anonymous_read_status" = 401
          jq -e '.error == "authentication_required"' /tmp/logitrack-anonymous-read >/dev/null
          tr -d '\r' </tmp/logitrack-anonymous-read-headers >/tmp/logitrack-anonymous-read-headers.normalized
          grep -Eqi '^content-type: application/json' /tmp/logitrack-anonymous-read-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-anonymous-read-headers.normalized
          if grep -Eqi '^set-cookie:' /tmp/logitrack-anonymous-read-headers.normalized; then
            echo 'anonymous proxy reads must not mutate authentication cookies' >&2
            exit 1
          fi

          forged_bff_status="$(curl --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --cookie "__Host-lt_access_token=$forged_token" \
            --dump-header /tmp/logitrack-forged-bff-headers --output /tmp/logitrack-forged-bff \
            --write-out '%{http_code}' "https://$TARGET_HOST/backend/api/deliveries")"
          test "$forged_bff_status" = 401
          jq -e '.error == "invalid_authentication"' /tmp/logitrack-forged-bff >/dev/null
          tr -d '\r' </tmp/logitrack-forged-bff-headers >/tmp/logitrack-forged-bff-headers.normalized
          grep -Eqi '^content-type: application/json' /tmp/logitrack-forged-bff-headers.normalized
          grep -Eqi '^cache-control: .*no-store' /tmp/logitrack-forged-bff-headers.normalized
          grep -Eqi '^set-cookie: __Host-lt_access_token=;.*max-age=0' /tmp/logitrack-forged-bff-headers.normalized

          auth_headers="$(curl --silent --show-error --head --proto '=https' --tlsv1.2 --max-time 20 \
            "https://$AUTH_HOST/oauth2/authorize" | tr -d '\r')"
          grep -Eq '^HTTP/[0-9.]+ 302' <<<"$auth_headers"
          grep -Eqi '^location: https://auth\.logitrack\.kr/error\?error=' <<<"$auth_headers"
          grep -Eqi '^strict-transport-security: max-age=31536000 *; includeSubDomains$' <<<"$auth_headers"
          grep -Eqi '^cache-control: .*no-store' <<<"$auth_headers"
          grep -Eqi '^x-frame-options: DENY$' <<<"$auth_headers"

          openssl s_client -servername "$TARGET_HOST" -connect "$TARGET_HOST:443" </dev/null 2>/dev/null \
            | openssl x509 -checkend 1209600 -noout
          openssl s_client -servername "$AUTH_HOST" -connect "$AUTH_HOST:443" </dev/null 2>/dev/null \
            | openssl x509 -checkend 1209600 -noout

          for port in 3000 5432 6379 8080 8090 29092; do
            if timeout 5 bash -c "</dev/tcp/$TARGET_HOST/$port" 2>/dev/null; then
              echo "private data port is reachable: $port" >&2
              exit 1
            fi
          done
