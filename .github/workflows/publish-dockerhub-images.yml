name: Publish Docker Hub images

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: dockerhub-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOCKERHUB_NAMESPACE: automaster5013
      IMAGE_PLATFORM: linux/amd64
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
      ARTIFACT_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted CI revision
        env:
          REVISION: ${{ github.sha }}
          TRIGGER_REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$TRIGGER_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$TRIGGER_REF" = refs/heads/main
          test "$TRIGGER_EVENT" = push
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$REVISION" origin/main
          test "$(git rev-parse HEAD)" = "$REVISION"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record supply-chain scanner version
        id: scanner
        run: |
          set -euo pipefail
          scanner_version="$(docker run --rm "$TRIVY_IMAGE" --version | awk '/^Version:/ { print $2; exit }')"
          [[ "$scanner_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$scanner_version" >> "$GITHUB_OUTPUT"

      - name: Build deployable service images
        env:
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          docker build --platform "$IMAGE_PLATFORM" --label org.opencontainers.image.source="$SOURCE_URL" --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-api:$REVISION" ./api
          docker build --platform "$IMAGE_PLATFORM" --label org.opencontainers.image.source="$SOURCE_URL" --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-analytics:$REVISION" ./analytics
          docker build --platform "$IMAGE_PLATFORM" --label org.opencontainers.image.source="$SOURCE_URL" --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-simulator:$REVISION" ./simulator
          docker build --platform "$IMAGE_PLATFORM" --build-arg NEXT_PUBLIC_API_URL=/backend --label org.opencontainers.image.source="$SOURCE_URL" --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-web:$REVISION" ./web
          docker build --platform "$IMAGE_PLATFORM" --label org.opencontainers.image.source="$SOURCE_URL" --label org.opencontainers.image.revision="$REVISION" --tag "logitrack-otel-collector:$REVISION" ./infra/otel

      - name: Enforce runtime and provenance metadata
        env:
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            test -n "$user" && test "$user" != 0 && test "$user" != root
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$image")" = "$SOURCE_URL"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$REVISION"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = "$IMAGE_PLATFORM"
            healthcheck="$(docker image inspect --format '{{json .Config.Healthcheck.Test}}' "$image")"
            test "$healthcheck" != null && test "$healthcheck" != '[]'
          done

      - name: Generate and validate supply-chain evidence
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p work/dockerhub-sbom
          for service in api analytics simulator web otel-collector; do
            image="logitrack-$service:$REVISION"
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume trivy-cache:/root/.cache/ --volume "$GITHUB_WORKSPACE/work/dockerhub-sbom:/output" "$TRIVY_IMAGE" image --scanners vuln --format cyclonedx --output "/output/logitrack-$service.cdx.json" --no-progress "$image"
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock --volume trivy-cache:/root/.cache/ --volume "$GITHUB_WORKSPACE/work/dockerhub-sbom:/output" "$TRIVY_IMAGE" image --scanners vuln --severity CRITICAL --format json --output "/output/logitrack-$service.critical.json" --exit-code 1 --no-progress "$image"
          done
          python scripts/sbom-smoke.py work/dockerhub-sbom --tag "$REVISION" --revision "$REVISION"

      - name: Upload immutable Docker Hub supply-chain evidence
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockerhub-supply-chain-${{ github.sha }}
          path: work/dockerhub-sbom/*.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Push immutable images and verify registry digests
        id: publish
        env:
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SCANNER_VERSION: ${{ steps.scanner.outputs.version }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVIDENCE_ARTIFACT_DIGEST_RAW: ${{ steps.evidence.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          mkdir -p work/dockerhub
          printf '[]' > work/dockerhub/images.json
          for service in api analytics simulator web otel-collector; do
            source_image="logitrack-$service:$REVISION"
            destination="docker.io/$DOCKERHUB_NAMESPACE/logitrack-$service:$REVISION"
            local_image_id="$(docker image inspect --format '{{.Id}}' "$source_image")"
            docker tag "$source_image" "$destination"
            if existing_manifest="$(docker buildx imagetools inspect "$destination" --format '{{json .Manifest}}' 2>/dev/null)"; then
              digest="$(jq -r .digest <<<"$existing_manifest")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              pinned="docker.io/$DOCKERHUB_NAMESPACE/logitrack-$service@$digest"
              docker pull --platform "$IMAGE_PLATFORM" "$pinned"
              remote_image_id="$(docker image inspect --format '{{.Id}}' "$pinned")"
              if [ "$remote_image_id" != "$local_image_id" ]; then
                echo "::error::$destination already exists with different immutable content"
                exit 1
              fi
            else
              docker push "$destination"
              digest="$(docker buildx imagetools inspect "$destination" --format '{{json .Manifest}}' | jq -r .digest)"
            fi
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "${service//-/_}-digest=$digest" >> "$GITHUB_OUTPUT"
            pinned="docker.io/$DOCKERHUB_NAMESPACE/logitrack-$service@$digest"
            docker image rm "$destination" >/dev/null
            docker pull --platform "$IMAGE_PLATFORM" "$pinned"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$pinned")" = "$SOURCE_URL"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$pinned")" = "$REVISION"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$pinned")" = "$IMAGE_PLATFORM"
            sbom_file="logitrack-$service.cdx.json"
            report_file="logitrack-$service.critical.json"
            sbom_sha256="$(sha256sum "work/dockerhub-sbom/$sbom_file" | awk '{print $1}')"
            report_sha256="$(sha256sum "work/dockerhub-sbom/$report_file" | awk '{print $1}')"
            jq --arg service "$service" --arg repository "$DOCKERHUB_NAMESPACE/logitrack-$service" --arg tag "$REVISION" --arg digest "$digest" --arg uri "$pinned" --arg sbomFile "$sbom_file" --arg sbomSha256 "$sbom_sha256" --arg vulnerabilityReportFile "$report_file" --arg vulnerabilityReportSha256 "$report_sha256" \
              '. + [{service: $service, repository: $repository, tag: $tag, digest: $digest, uri: $uri, sbomFile: $sbomFile, sbomSha256: $sbomSha256, vulnerabilityReportFile: $vulnerabilityReportFile, vulnerabilityReportSha256: $vulnerabilityReportSha256}]' \
              work/dockerhub/images.json > work/dockerhub/images.next.json
            mv work/dockerhub/images.next.json work/dockerhub/images.json
          done
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          [[ "$EVIDENCE_ARTIFACT_DIGEST_RAW" =~ ^[0-9a-f]{64}$ ]]
          evidence_artifact_digest="sha256:$EVIDENCE_ARTIFACT_DIGEST_RAW"
          artifact_url_pattern="^https://github\.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/[1-9][0-9]*$"
          [[ "$EVIDENCE_ARTIFACT_URL" =~ $artifact_url_pattern ]]
          jq -n --arg revision "$REVISION" --arg publishedAt "$published_at" --arg namespace "$DOCKERHUB_NAMESPACE" --arg sourceRepository "$GITHUB_REPOSITORY" --arg imagePlatform "$IMAGE_PLATFORM" --arg scannerImage "$TRIVY_IMAGE" --arg scannerVersion "$SCANNER_VERSION" --argjson workflowRunId "$GITHUB_RUN_ID" --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" --arg workflowRunUrl "$WORKFLOW_RUN_URL" --arg workflowEvent "$GITHUB_EVENT_NAME" --arg workflowRef "$WORKFLOW_REF" --arg workflowSha "$WORKFLOW_SHA" --argjson artifactRetentionDays "$ARTIFACT_RETENTION_DAYS" --arg evidenceArtifact "dockerhub-supply-chain-$REVISION" --arg evidenceArtifactDigest "$evidence_artifact_digest" --arg evidenceArtifactUrl "$EVIDENCE_ARTIFACT_URL" --slurpfile images work/dockerhub/images.json \
            '{schemaVersion: 3, revision: $revision, publishedAt: $publishedAt, registry: "docker.io", namespace: $namespace, sourceRepository: $sourceRepository, imagePlatform: $imagePlatform, scannerImage: $scannerImage, scannerVersion: $scannerVersion, blockedVulnerabilitySeverities: ["CRITICAL"], workflowRunId: $workflowRunId, workflowRunAttempt: $workflowRunAttempt, workflowRunUrl: $workflowRunUrl, workflowEvent: $workflowEvent, workflowRef: $workflowRef, workflowSha: $workflowSha, artifactRetentionDays: $artifactRetentionDays, evidenceArtifact: $evidenceArtifact, evidenceArtifactDigest: $evidenceArtifactDigest, evidenceArtifactUrl: $evidenceArtifactUrl, images: $images[0]}' > work/dockerhub/release-manifest.json
          echo "published-at=$published_at" >> "$GITHUB_OUTPUT"

      - name: Attest API image provenance
        id: attest-api
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: docker.io/automaster5013/logitrack-api
          subject-digest: ${{ steps.publish.outputs.api-digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest analytics image provenance
        id: attest-analytics
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: docker.io/automaster5013/logitrack-analytics
          subject-digest: ${{ steps.publish.outputs.analytics-digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest simulator image provenance
        id: attest-simulator
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: docker.io/automaster5013/logitrack-simulator
          subject-digest: ${{ steps.publish.outputs.simulator-digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest web image provenance
        id: attest-web
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: docker.io/automaster5013/logitrack-web
          subject-digest: ${{ steps.publish.outputs.web-digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest OpenTelemetry Collector image provenance
        id: attest-otel
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: docker.io/automaster5013/logitrack-otel-collector
          subject-digest: ${{ steps.publish.outputs.otel_collector-digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Bind signed provenance to release manifest
        env:
          REVISION: ${{ github.sha }}
          PUBLISHED_AT: ${{ steps.publish.outputs.published-at }}
          SCANNER_VERSION: ${{ steps.scanner.outputs.version }}
          EVIDENCE_ARTIFACT_DIGEST: sha256:${{ steps.evidence.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          API_ATTESTATION_ID: ${{ steps.attest-api.outputs.attestation-id }}
          API_ATTESTATION_URL: ${{ steps.attest-api.outputs.attestation-url }}
          ANALYTICS_ATTESTATION_ID: ${{ steps.attest-analytics.outputs.attestation-id }}
          ANALYTICS_ATTESTATION_URL: ${{ steps.attest-analytics.outputs.attestation-url }}
          SIMULATOR_ATTESTATION_ID: ${{ steps.attest-simulator.outputs.attestation-id }}
          SIMULATOR_ATTESTATION_URL: ${{ steps.attest-simulator.outputs.attestation-url }}
          WEB_ATTESTATION_ID: ${{ steps.attest-web.outputs.attestation-id }}
          WEB_ATTESTATION_URL: ${{ steps.attest-web.outputs.attestation-url }}
          OTEL_ATTESTATION_ID: ${{ steps.attest-otel.outputs.attestation-id }}
          OTEL_ATTESTATION_URL: ${{ steps.attest-otel.outputs.attestation-url }}
        run: |
          set -euo pipefail
          jq --arg apiId "$API_ATTESTATION_ID" --arg apiUrl "$API_ATTESTATION_URL" --arg analyticsId "$ANALYTICS_ATTESTATION_ID" --arg analyticsUrl "$ANALYTICS_ATTESTATION_URL" --arg simulatorId "$SIMULATOR_ATTESTATION_ID" --arg simulatorUrl "$SIMULATOR_ATTESTATION_URL" --arg webId "$WEB_ATTESTATION_ID" --arg webUrl "$WEB_ATTESTATION_URL" --arg otelId "$OTEL_ATTESTATION_ID" --arg otelUrl "$OTEL_ATTESTATION_URL" \
            '.schemaVersion = 4 | (.images[] | select(.service == "api")) += {attestationId: $apiId, attestationUrl: $apiUrl} | (.images[] | select(.service == "analytics")) += {attestationId: $analyticsId, attestationUrl: $analyticsUrl} | (.images[] | select(.service == "simulator")) += {attestationId: $simulatorId, attestationUrl: $simulatorUrl} | (.images[] | select(.service == "web")) += {attestationId: $webId, attestationUrl: $webUrl} | (.images[] | select(.service == "otel-collector")) += {attestationId: $otelId, attestationUrl: $otelUrl}' \
            work/dockerhub/release-manifest.json > work/dockerhub/release-manifest.next.json
          mv work/dockerhub/release-manifest.next.json work/dockerhub/release-manifest.json
          python scripts/dockerhub-release-manifest-smoke.py work/dockerhub/release-manifest.json \
            --evidence-dir work/dockerhub-sbom --revision "$REVISION" --published-at "$PUBLISHED_AT" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$WORKFLOW_REF" --workflow-sha "$WORKFLOW_SHA" \
            --scanner-image "$TRIVY_IMAGE" --scanner-version "$SCANNER_VERSION" \
            --evidence-artifact-digest "$EVIDENCE_ARTIFACT_DIGEST" --evidence-artifact-url "$EVIDENCE_ARTIFACT_URL"

      - name: Upload immutable Docker Hub release manifest
        id: release-manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockerhub-release-${{ github.sha }}
          path: work/dockerhub/release-manifest.json
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Record publication summary
        env:
          REVISION: ${{ github.sha }}
          PUBLISHED_AT: ${{ steps.publish.outputs.published-at }}
          SCANNER_VERSION: ${{ steps.scanner.outputs.version }}
          EVIDENCE_ARTIFACT_DIGEST: sha256:${{ steps.evidence.outputs.artifact-digest }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          RELEASE_MANIFEST_DIGEST: sha256:${{ steps.release-manifest.outputs.artifact-digest }}
          RELEASE_MANIFEST_URL: ${{ steps.release-manifest.outputs.artifact-url }}
        run: |
          {
            echo "## Docker Hub publication"
            echo ""
            echo "Published five verified images for \`$REVISION\` to \`$DOCKERHUB_NAMESPACE\`."
            echo ""
            echo "- Published at: \`$PUBLISHED_AT\`"
            echo "- Scanner: \`$TRIVY_IMAGE\` (version \`$SCANNER_VERSION\`)"
            echo "- Blocked vulnerability severities: \`CRITICAL\`"
            echo "- Evidence retention: \`$ARTIFACT_RETENTION_DAYS days\`"
            echo "- Supply-chain evidence: [$EVIDENCE_ARTIFACT_DIGEST]($EVIDENCE_ARTIFACT_URL)"
            echo "- Release manifest: [$RELEASE_MANIFEST_DIGEST]($RELEASE_MANIFEST_URL)"
            echo ""
            jq -r '.images[] | "- `" + .uri + "`"' work/dockerhub/release-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
