name: Docker Hub provenance audit

on:
  workflow_dispatch:
  schedule:
    - cron: "41 19 * * *"

permissions:
  contents: read
  attestations: read

concurrency:
  group: dockerhub-provenance-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Verify current main image provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_CLI_VERSION: 2.101.0
      GH_CLI_ARCHIVE_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
      ARTIFACT_RETENTION_DAYS: 30
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned provenance verifier
        run: |
          set -euo pipefail
          archive="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          source_url="https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/$archive"
          mkdir -p work/tools
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 --output "work/tools/$archive" "$source_url"
          echo "$GH_CLI_ARCHIVE_SHA256  work/tools/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "work/tools/$archive" --directory work/tools
          verifier="$GITHUB_WORKSPACE/work/tools/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          test "$("$verifier" version | awk 'NR == 1 { print $3 }')" = "$GH_CLI_VERSION"
          echo "$(dirname "$verifier")" >> "$GITHUB_PATH"

      - name: Verify current main Docker Hub attestations
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          revision="$(git rev-parse HEAD)"
          test "$revision" = "$(git rev-parse origin/main)"
          ./scripts/dockerhub-provenance-audit.sh "$revision"

      - name: Seal provenance audit evidence
        run: |
          set -euo pipefail
          cd work/dockerhub-provenance-audit
          test "$(find . -maxdepth 1 -type f -name '*.json' | wc -l)" -eq 10
          sha256sum ./*.json | LC_ALL=C sort --key=2 > SHA256SUMS
          sha256sum --check --strict SHA256SUMS

      - name: Upload immutable provenance audit evidence
        id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dockerhub-provenance-audit-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            work/dockerhub-provenance-audit/*.json
            work/dockerhub-provenance-audit/SHA256SUMS
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      - name: Record audit summary
        if: success()
        env:
          EVIDENCE_DIGEST: sha256:${{ steps.evidence.outputs.artifact-digest }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          [[ "$EVIDENCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVIDENCE_URL" =~ ^https://github\.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts/[1-9][0-9]*$ ]]
          {
            echo "## Docker Hub provenance audit"
            echo ""
            echo "Verified all five current `main` image attestations directly from Docker Hub."
            echo ""
            echo "- Revision: `$(git rev-parse HEAD)`"
            echo "- Verifier: GitHub CLI `$GH_CLI_VERSION`"
            echo "- Verifier archive SHA-256: `$GH_CLI_ARCHIVE_SHA256`"
            echo "- Evidence retention: `$ARTIFACT_RETENTION_DAYS days`"
            echo "- Evidence: [$EVIDENCE_DIGEST]($EVIDENCE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
