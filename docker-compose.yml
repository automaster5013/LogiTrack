name: logitrack
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logitrack}
      POSTGRES_USER: ${POSTGRES_USER:-logitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: {condition: service_healthy}
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery.created.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.dlq.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.received.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouse.outbound.picked.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouse.outbound.dispatched.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery.alert.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.created.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.dispatched.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.fulfilled.v1 --partitions 3 --replication-factor 1

  analytics:
    build: ./analytics
    environment:
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-2.5}
      ROUTING_CACHE_TTL_SECONDS: ${ROUTING_CACHE_TTL_SECONDS:-300}
      OTEL_SERVICE_NAME: logitrack-route-analytics
      INSTANCE_ID: analytics-1
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logitrack
      DB_USER: logitrack
      DB_PASSWORD: logitrack
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ANALYTICS_URL: http://analytics:8090
      INSTANCE_ID: api-primary
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analytics: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-replica:
    profiles: ["scale-test"]
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logitrack
      DB_USER: logitrack
      DB_PASSWORD: logitrack
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ANALYTICS_URL: http://analytics:8090
      INSTANCE_ID: api-replica
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["8081:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analytics: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  simulator:
    build: ./simulator
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SIMULATION_INTERVAL_SECONDS: 1
      SIMULATION_STEPS: 20
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/otel/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["3200:3200"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./infra/otel/collector.yml:/etc/otelcol-contrib/config.yml:ro"]
    ports: ["4317:4317", "4318:4318", "13133:13133"]
    depends_on: [tempo]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports: ["3001:3000"]
    volumes: ["./infra/grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [prometheus, tempo]

volumes:
  postgres-data:
  tempo-data:
