name: logitrack
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-security: &default-security
  - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 768m
    cpus: 1.0
    security_opt: *default-security
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-logitrack}
      POSTGRES_USER: ${POSTGRES_USER:-logitrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 256m
    cpus: 0.5
    security_opt: *default-security
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 1g
    cpus: 1.5
    security_opt: *default-security
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: ["kafka-data:/tmp/kafka-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    logging: *default-logging
    security_opt: *default-security
    depends_on:
      kafka: {condition: service_healthy}
    command:
      - /bin/bash
      - -c
      - |
        set -eu
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery.created.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.dlq.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic inventory.received.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouse.outbound.picked.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic warehouse.outbound.dispatched.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery.alert.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.created.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.dispatched.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.fulfilled.v1 --partitions 3 --replication-factor 1

  analytics:
    build: ./analytics
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 512m
    cpus: 1.0
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-osrm}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      ROUTING_TIMEOUT_SECONDS: ${ROUTING_TIMEOUT_SECONDS:-2.5}
      ROUTING_CACHE_TTL_SECONDS: ${ROUTING_CACHE_TTL_SECONDS:-300}
      MAX_REQUEST_BODY_BYTES: ${ANALYTICS_MAX_REQUEST_BODY_BYTES:-2097152}
      OTEL_SERVICE_NAME: logitrack-route-analytics
      INSTANCE_ID: analytics-1
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["127.0.0.1:8090:8090"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 1536m
    cpus: 2.0
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-logitrack}
      DB_USER: ${POSTGRES_USER:-logitrack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ANALYTICS_URL: http://analytics:8090
      INSTANCE_ID: api-primary
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analytics: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  api-replica:
    profiles: ["scale-test"]
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 1536m
    cpus: 2.0
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-logitrack}
      DB_USER: ${POSTGRES_USER:-logitrack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-logitrack}
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ANALYTICS_URL: http://analytics:8090
      INSTANCE_ID: api-replica
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analytics: {condition: service_healthy}
      otel-collector: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  simulator:
    build: ./simulator
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 256m
    cpus: 0.5
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SIMULATION_INTERVAL_SECONDS: 1
      SIMULATION_STEPS: 20
      SIMULATION_MAX_WORKERS: ${SIMULATION_MAX_WORKERS:-8}
      SIMULATOR_HEALTH_FILE: /tmp/logitrack-simulator-heartbeat
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; p='/tmp/logitrack-simulator-heartbeat'; assert time.time() - os.path.getmtime(p) < 5"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 512m
    cpus: 0.75
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 768m
    cpus: 1.0
    security_opt: *default-security
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./infra/otel/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports: ["127.0.0.1:3200:3200"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  otel-collector:
    build: ./infra/otel
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 512m
    cpus: 0.75
    security_opt: *default-security
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes: ["./infra/otel/collector.yml:/etc/otelcol-contrib/config.yml:ro"]
    ports: ["127.0.0.1:4317:4317", "127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    depends_on:
      tempo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 768m
    cpus: 1.0
    security_opt: *default-security
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    restart: unless-stopped
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 512m
    cpus: 0.75
    security_opt: *default-security
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports: ["127.0.0.1:3001:3000"]
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
      tempo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  tempo-data:
  prometheus-data:
  grafana-data:
