global:
  scrape_interval: 10s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/prometheus-alerts.yml
scrape_configs:
  - job_name: logitrack-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
  - job_name: logitrack-alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
