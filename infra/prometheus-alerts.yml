groups:
  - name: logitrack-recovery
    rules:
      - alert: LogiTrackApiDown
        expr: up{job="logitrack-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: LogiTrack API is unavailable to Prometheus
          description: The API metrics endpoint has been unreachable for at least one minute.
      - alert: LogiTrackRecoveryMetricRefreshFailing
        expr: increase(logitrack_recovery_metrics_refresh_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Recovery queue metrics are stale
          description: The API could not refresh recovery queue gauges from PostgreSQL.
      - alert: LogiTrackOutboxFailed
        expr: logitrack_outbox_backlog{status="failed"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Transactional outbox contains failed events
          description: "{{ $value }} outbox event(s) exhausted retries and require operator recovery."
      - alert: LogiTrackOutboxPublisherFailing
        expr: increase(logitrack_outbox_publish_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Transactional outbox publisher is failing
          description: "{{ $value }} outbox polling attempt(s) failed during the last five minutes."
      - alert: LogiTrackOutboxBacklogGrowing
        expr: logitrack_outbox_backlog{status="pending"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Transactional outbox backlog is elevated
          description: "{{ $value }} outbox event(s) are waiting to be published."
      - alert: LogiTrackOutboxOldestPending
        expr: logitrack_outbox_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: An outbox event has been pending too long
          description: "The oldest pending outbox event is {{ $value }} seconds old."
      - alert: LogiTrackDeadLetterBacklog
        expr: logitrack_dlq_backlog > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telemetry dead-letter events require attention
          description: "{{ $value }} telemetry event(s) are waiting for replay."
      - alert: LogiTrackRouteAnalysisDegraded
        expr: increase(logitrack_route_analysis_total{outcome="fallback"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Route analysis is repeatedly using the local fallback
          description: "{{ $value }} route requests used the fallback during the last five minutes."
      - alert: LogiTrackPdfRenderingFailing
        expr: increase(logitrack_report_pdf_total{outcome="failure"}[10m]) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: KPI PDF rendering is repeatedly failing
          description: "{{ $value }} KPI PDF requests failed during the last ten minutes."
      - alert: LogiTrackKpiProjectionStale
        expr: |
          logitrack_kpi_projection_last_success_timestamp_seconds > 0
          and
          time() - logitrack_kpi_projection_last_success_timestamp_seconds
            > 3 * logitrack_kpi_projection_refresh_interval_seconds
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Daily KPI projection is stale
          description: The KPI projection has not completed successfully within three configured refresh intervals.
      - alert: LogiTrackApiServerErrors
        expr: sum(increase(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5.."}[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: LogiTrack API is returning repeated server errors
          description: "{{ $value }} API requests returned 5xx during the last five minutes."
      - alert: LogiTrackApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="logitrack-control-api"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LogiTrack API p95 latency is elevated
          description: "API p95 latency has exceeded two seconds for five minutes."
      - alert: LogiTrackTelemetryConsumerLagHigh
        expr: sum(kafka_consumer_fetch_manager_records_lag{application="logitrack-control-api",topic="vehicle_telemetry_v1"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telemetry consumer lag is elevated
          description: "{{ $value }} telemetry event(s) are waiting across assigned Kafka partitions."
      - alert: LogiTrackTelemetryConsumerMissing
        expr: absent(kafka_consumer_coordinator_assigned_partitions{application="logitrack-control-api",client_id=~"consumer-control-api-telemetry-v1-.+"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Telemetry consumer metrics are missing
          description: The API is reachable but telemetry consumer assignment metrics are not being exported.
      - alert: LogiTrackRetentionCleanupFailing
        expr: increase(logitrack_retention_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Retention cleanup is failing
          description: A scheduled operational data cleanup transaction failed during the last 15 minutes.
