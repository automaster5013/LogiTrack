groups:
  - name: logitrack-recovery
    rules:
      - alert: LogiTrackApiDown
        expr: up{job="logitrack-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: LogiTrack API is unavailable to Prometheus
          description: The API metrics endpoint has been unreachable for at least one minute.
      - alert: LogiTrackRecoveryMetricRefreshFailing
        expr: increase(logitrack_recovery_metrics_refresh_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Recovery queue metrics are stale
          description: The API could not refresh recovery queue gauges from PostgreSQL.
      - alert: LogiTrackOutboxFailed
        expr: logitrack_outbox_backlog{status="failed"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Transactional outbox contains failed events
          description: "{{ $value }} outbox event(s) exhausted retries and require operator recovery."
      - alert: LogiTrackOutboxBacklogGrowing
        expr: logitrack_outbox_backlog{status="pending"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Transactional outbox backlog is elevated
          description: "{{ $value }} outbox event(s) are waiting to be published."
      - alert: LogiTrackDeadLetterBacklog
        expr: logitrack_dlq_backlog > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Telemetry dead-letter events require attention
          description: "{{ $value }} telemetry event(s) are waiting for replay."
      - alert: LogiTrackRouteAnalysisDegraded
        expr: increase(logitrack_route_analysis_total{outcome="fallback"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Route analysis is repeatedly using the local fallback
          description: "{{ $value }} route requests used the fallback during the last five minutes."
      - alert: LogiTrackPdfRenderingFailing
        expr: increase(logitrack_report_pdf_total{outcome="failure"}[10m]) > 2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: KPI PDF rendering is repeatedly failing
          description: "{{ $value }} KPI PDF requests failed during the last ten minutes."
      - alert: LogiTrackApiServerErrors
        expr: sum(increase(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5.."}[5m])) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: LogiTrack API is returning repeated server errors
          description: "{{ $value }} API requests returned 5xx during the last five minutes."
      - alert: LogiTrackApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="logitrack-control-api"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LogiTrack API p95 latency is elevated
          description: "API p95 latency has exceeded two seconds for five minutes."
