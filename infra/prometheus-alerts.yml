groups:
  - name: logitrack-api-slo
    rules:
      - record: logitrack_api:slo_request_error_ratio:rate5m
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5..",uri!~"/actuator.*"}[5m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",uri!~"/actuator.*"}[5m])), 1e-9)
      - record: logitrack_api:slo_request_error_ratio:rate30m
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5..",uri!~"/actuator.*"}[30m]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",uri!~"/actuator.*"}[30m])), 1e-9)
      - record: logitrack_api:slo_request_error_ratio:rate1h
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5..",uri!~"/actuator.*"}[1h]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",uri!~"/actuator.*"}[1h])), 1e-9)
      - record: logitrack_api:slo_request_error_ratio:rate6h
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5..",uri!~"/actuator.*"}[6h]))
          /
          clamp_min(sum by (application) (rate(http_server_requests_seconds_count{application="logitrack-control-api",uri!~"/actuator.*"}[6h])), 1e-9)
      - alert: LogiTrackApiErrorBudgetFastBurn
        expr: |
          logitrack_api:slo_request_error_ratio:rate5m > 14.4 * 0.001
          and
          logitrack_api:slo_request_error_ratio:rate1h > 14.4 * 0.001
        for: 2m
        labels:
          severity: critical
          slo: availability-99.9
          component: api
        annotations:
          summary: API availability error budget is burning rapidly
          description: The 99.9% API availability error budget is burning above 14.4x across both five-minute and one-hour windows.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackapierrorbudgetfastburn
      - alert: LogiTrackApiErrorBudgetSlowBurn
        expr: |
          logitrack_api:slo_request_error_ratio:rate30m > 6 * 0.001
          and
          logitrack_api:slo_request_error_ratio:rate6h > 6 * 0.001
        for: 15m
        labels:
          severity: warning
          slo: availability-99.9
          component: api
        annotations:
          summary: API availability error budget is burning persistently
          description: The 99.9% API availability error budget is burning above 6x across both thirty-minute and six-hour windows.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackapierrorbudgetslowburn

  - name: logitrack-recovery
    rules:
      - alert: LogiTrackApiDown
        expr: up{job="logitrack-api"} == 0
        for: 1m
        labels:
          severity: critical
          component: api
        annotations:
          summary: LogiTrack API is unavailable to Prometheus
          description: The API metrics endpoint has been unreachable for at least one minute.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackapidown
      - alert: LogiTrackRecoveryMetricRefreshFailing
        expr: increase(logitrack_recovery_metrics_refresh_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: recovery
        annotations:
          summary: Recovery queue metrics are stale
          description: The API could not refresh recovery queue gauges from PostgreSQL.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackrecoverymetricrefreshfailing
      - alert: LogiTrackOutboxFailed
        expr: logitrack_outbox_backlog{status="failed"} > 0
        for: 2m
        labels:
          severity: critical
          component: outbox
        annotations:
          summary: Transactional outbox contains failed events
          description: "{{ $value }} outbox event(s) exhausted retries and require operator recovery."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackoutboxfailed
      - alert: LogiTrackOutboxPublisherFailing
        expr: increase(logitrack_outbox_publish_failures_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: Transactional outbox publisher is failing
          description: "{{ $value }} outbox polling attempt(s) failed during the last five minutes."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackoutboxpublisherfailing
      - alert: LogiTrackOutboxBacklogGrowing
        expr: logitrack_outbox_backlog{status="pending"} > 100
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: Transactional outbox backlog is elevated
          description: "{{ $value }} outbox event(s) are waiting to be published."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackoutboxbackloggrowing
      - alert: LogiTrackOutboxOldestPending
        expr: logitrack_outbox_oldest_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          component: outbox
        annotations:
          summary: An outbox event has been pending too long
          description: "The oldest pending outbox event is {{ $value }} seconds old."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackoutboxoldestpending
      - alert: LogiTrackDeadLetterBacklog
        expr: logitrack_dlq_backlog > 0
        for: 5m
        labels:
          severity: warning
          component: telemetry
        annotations:
          summary: Telemetry dead-letter events require attention
          description: "{{ $value }} telemetry event(s) are waiting for replay."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackdeadletterbacklog
      - alert: LogiTrackRouteAnalysisDegraded
        expr: increase(logitrack_route_analysis_total{outcome="fallback"}[5m]) > 5
        for: 1m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: Route analysis is repeatedly using the local fallback
          description: "{{ $value }} route requests used the fallback during the last five minutes."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackrouteanalysisdegraded
      - alert: LogiTrackPdfRenderingFailing
        expr: increase(logitrack_report_pdf_total{outcome="failure"}[10m]) > 2
        for: 1m
        labels:
          severity: warning
          component: reporting
        annotations:
          summary: KPI PDF rendering is repeatedly failing
          description: "{{ $value }} KPI PDF requests failed during the last ten minutes."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackpdfrenderingfailing
      - alert: LogiTrackKpiProjectionStale
        expr: |
          logitrack_kpi_projection_last_success_timestamp_seconds > 0
          and
          time() - logitrack_kpi_projection_last_success_timestamp_seconds
            > 3 * logitrack_kpi_projection_refresh_interval_seconds
        for: 1m
        labels:
          severity: warning
          component: reporting
        annotations:
          summary: Daily KPI projection is stale
          description: The KPI projection has not completed successfully within three configured refresh intervals.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackkpiprojectionstale
      - alert: LogiTrackApiServerErrors
        expr: sum(increase(http_server_requests_seconds_count{application="logitrack-control-api",status=~"5.."}[5m])) > 5
        for: 1m
        labels:
          severity: warning
          component: api
        annotations:
          summary: LogiTrack API is returning repeated server errors
          description: "{{ $value }} API requests returned 5xx during the last five minutes."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackapiservererrors
      - alert: LogiTrackApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="logitrack-control-api"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: LogiTrack API p95 latency is elevated
          description: "API p95 latency has exceeded two seconds for five minutes."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackapilatencyhigh
      - alert: LogiTrackTelemetryConsumerLagHigh
        expr: sum(kafka_consumer_fetch_manager_records_lag{application="logitrack-control-api",topic="vehicle_telemetry_v1"}) > 100
        for: 5m
        labels:
          severity: warning
          component: telemetry
        annotations:
          summary: Telemetry consumer lag is elevated
          description: "{{ $value }} telemetry event(s) are waiting across assigned Kafka partitions."
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitracktelemetryconsumerlaghigh
      - alert: LogiTrackTelemetryConsumerMissing
        expr: absent(kafka_consumer_coordinator_assigned_partitions{application="logitrack-control-api",client_id=~"consumer-control-api-telemetry-v1-.+"})
        for: 2m
        labels:
          severity: critical
          component: telemetry
        annotations:
          summary: Telemetry consumer metrics are missing
          description: The API is reachable but telemetry consumer assignment metrics are not being exported.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitracktelemetryconsumermissing
      - alert: LogiTrackRetentionCleanupFailing
        expr: increase(logitrack_retention_failures_total[15m]) > 0
        for: 1m
        labels:
          severity: warning
          component: retention
        annotations:
          summary: Retention cleanup is failing
          description: A scheduled operational data cleanup transaction failed during the last 15 minutes.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackretentioncleanupfailing
      - alert: LogiTrackDemoCleanupFailing
        expr: |
          increase(logitrack_demo_cleanup_failures_total[15m]) > 0
          or
          (
            logitrack_demo_cleanup_last_success_timestamp_seconds > 0
            and time() - logitrack_demo_cleanup_last_success_timestamp_seconds > 900
          )
          or
          (
            logitrack_demo_cleanup_last_success_timestamp_seconds == 0
            and time() - logitrack_demo_cleanup_monitor_started_timestamp_seconds > 900
          )
        for: 1m
        labels:
          severity: warning
          component: demo
        annotations:
          summary: Completed demo delivery cleanup is failing or stale
          description: The demo cleanup failed, never started, or has not completed successfully during the last 15 minutes.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackdemocleanupfailing
      - alert: LogiTrackDemoFleetBelowTarget
        expr: |
          logitrack_demo_active_deliveries < logitrack_demo_target_deliveries
          or increase(logitrack_demo_replenishment_failures_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: demo
        annotations:
          summary: Live demo fleet is below its configured target
          description: Active demo vehicles remain below target or replenishment attempts are failing.
          runbook_url: https://github.com/automaster5013/LogiTrack/blob/main/docs/alert-runbooks.md#logitrackdemofleetbelowtarget
