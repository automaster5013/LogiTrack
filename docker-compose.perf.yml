name: logitrack-perf
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"
x-security: &default-security
  - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine@sha256:f02121de6f74d30d8a94cd1d9584125e2178d7e6c377d8130112d4e52d867995
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    security_opt: *default-security
    networks: [data]
    environment:
      POSTGRES_DB: logitrack
      POSTGRES_USER: logitrack
      POSTGRES_PASSWORD: logitrack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logitrack"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["postgres-perf-data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    security_opt: *default-security
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 512
    security_opt: *default-security
    networks: [data]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-perf-data:/var/lib/kafka/data"]
    tmpfs:
      - /etc/kafka/secrets:size=16m,mode=1777
      - /mnt/shared/config:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0@sha256:3f7b939115cd4872e9cee9369d80bd69712fde55f9902f46d793f64848dedc75
    logging: *default-logging
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    security_opt: *default-security
    networks: [data]
    depends_on:
      kafka: {condition: service_healthy}
    command:
      - /bin/bash
      - -c
      - |
        set -eu
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic delivery.created.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.v1 --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic vehicle.telemetry.dlq.v1 --partitions 3 --replication-factor 1

  analytics:
    build: ./analytics
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    security_opt: *default-security
    networks: [analytics]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    environment:
      ROUTING_PROVIDER: geodesic
      OTEL_SDK_DISABLED: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    logging: *default-logging
    stop_grace_period: 35s
    mem_limit: 2g
    cpus: 4.0
    pids_limit: 768
    security_opt: *default-security
    networks: [data, analytics, runner]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/logitrack
      DB_USER: logitrack
      DB_PASSWORD: logitrack
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_HOST: redis
      ANALYTICS_URL: http://analytics:8090
      INSTANCE_ID: api-perf
      TRACING_SAMPLING_PROBABILITY: "0"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "32"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "8"
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      analytics: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep UP"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-perf-data:
  kafka-perf-data:

networks:
  data:
    internal: true
  analytics:
    internal: true
  runner:
