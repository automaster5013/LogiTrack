spring:
  application.name: logitrack-control-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logitrack}
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD:logitrack}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: control-api-telemetry-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener.observation-enabled: true
    template.observation-enabled: true
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  data.redis.timeout: ${REDIS_COMMAND_TIMEOUT:2s}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    group.readiness.include: readinessState,db
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{requestId:-}] "
server:
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/geo+json,text/csv
logitrack:
  analytics:
    url: ${ANALYTICS_URL:http://localhost:8090}
    route-connect-timeout: ${ANALYTICS_ROUTE_CONNECT_TIMEOUT:1s}
    route-read-timeout: ${ANALYTICS_ROUTE_READ_TIMEOUT:4s}
    report-connect-timeout: ${ANALYTICS_REPORT_CONNECT_TIMEOUT:1s}
    report-read-timeout: ${ANALYTICS_REPORT_READ_TIMEOUT:15s}
  instance-id: ${INSTANCE_ID:${random.uuid}}
  telemetry.max-future-skew: ${TELEMETRY_MAX_FUTURE_SKEW:5m}
  stream.channel: ${STREAM_CHANNEL:logitrack.stream.v1}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
