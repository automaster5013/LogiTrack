spring:
  application.name: logitrack-control-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logitrack}
    username: ${DB_USER:logitrack}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:2000}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: control-api-telemetry-v1
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    listener.observation-enabled: true
    template.observation-enabled: true
  data.redis.host: ${REDIS_HOST:localhost}
  data.redis.connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  data.redis.timeout: ${REDIS_COMMAND_TIMEOUT:2s}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health:
    probes.enabled: true
    group.readiness.include: readinessState,db
  metrics.tags.application: ${spring.application.name}
  metrics.distribution.slo.http.server.requests: 100ms,250ms,500ms,1s,2s,5s
  tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} requestId=%X{requestId:-}] "
server:
  shutdown: graceful
  connection-timeout: ${SERVER_CONNECTION_TIMEOUT:5s}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/geo+json,text/csv
  tomcat:
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    max-connections: ${SERVER_MAX_CONNECTIONS:512}
    keep-alive-timeout: ${SERVER_KEEP_ALIVE_TIMEOUT:20s}
    max-keep-alive-requests: ${SERVER_MAX_KEEP_ALIVE_REQUESTS:100}
    mbeanregistry.enabled: true
    threads:
      max: ${SERVER_MAX_THREADS:128}
      min-spare: ${SERVER_MIN_SPARE_THREADS:10}
logitrack:
  security.enabled: ${SECURITY_ENABLED:true}
  security.client-id: ${SECURITY_CLIENT_ID}
  http.max-request-body-size: ${HTTP_MAX_REQUEST_BODY_SIZE:1MB}
  http.rate-limit:
    requests: ${HTTP_RATE_LIMIT_REQUESTS:300}
    window-seconds: ${HTTP_RATE_LIMIT_WINDOW_SECONDS:60}
    max-subjects: ${HTTP_RATE_LIMIT_MAX_SUBJECTS:10000}
  analytics:
    url: ${ANALYTICS_URL:http://localhost:8090}
    route-connect-timeout: ${ANALYTICS_ROUTE_CONNECT_TIMEOUT:1s}
    route-read-timeout: ${ANALYTICS_ROUTE_READ_TIMEOUT:4s}
    route-max-response-size: ${ANALYTICS_ROUTE_MAX_RESPONSE_SIZE:2MB}
    report-connect-timeout: ${ANALYTICS_REPORT_CONNECT_TIMEOUT:1s}
    report-read-timeout: ${ANALYTICS_REPORT_READ_TIMEOUT:15s}
    report-max-response-size: ${ANALYTICS_REPORT_MAX_RESPONSE_SIZE:10MB}
  instance-id: ${INSTANCE_ID:${random.uuid}}
  telemetry.max-future-skew: ${TELEMETRY_MAX_FUTURE_SKEW:5m}
  outbox:
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    publish-timeout: ${OUTBOX_PUBLISH_TIMEOUT:5s}
  stream:
    channel: ${STREAM_CHANNEL:logitrack.stream.v1}
    heartbeat-ms: ${SSE_HEARTBEAT_MS:15000}
    max-connections: ${SSE_MAX_CONNECTIONS:1000}
    max-connections-per-subject: ${SSE_MAX_CONNECTIONS_PER_SUBJECT:5}
  retention:
    processed-events: ${PROCESSED_EVENT_RETENTION:30d}
    published-outbox: ${PUBLISHED_OUTBOX_RETENTION:7d}
    telemetry: ${TELEMETRY_RETENTION:30d}
    replayed-dlq: ${REPLAYED_DLQ_RETENTION:90d}
    batch-size: ${RETENTION_BATCH_SIZE:1000}
    initial-delay-ms: ${RETENTION_INITIAL_DELAY_MS:60000}
    poll-delay-ms: ${RETENTION_POLL_DELAY_MS:300000}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
